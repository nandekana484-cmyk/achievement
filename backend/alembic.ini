# Alembic settings, for creating / applying migrations by hand.
# The app upgrades the DB to the latest revision on startup (app/db/migrate.py),
# so this file is normally not needed.
#
# NOTE: keep this file ASCII only. Alembic reads it with the OS locale encoding (cp932 on Japanese Windows).
#
# Usage (in the backend folder, inside the venv):
#   python -m alembic revision --autogenerate -m "message"   # always review the generated file
#   python -m alembic upgrade head
# Target DB: paths.database in config.toml (GENBA_CONFIG).

[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
