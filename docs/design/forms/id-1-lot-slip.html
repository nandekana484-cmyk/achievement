<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基板製品ロット現品票 (A6サイズ)</title>
<!-- 実際のバーコードを正確に描画する軽量ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
  /* A6縦サイズ印刷設定 (105mm × 148mm) */
  @page {
    size: 105mm 148mm;
    margin: 0;
  }
  * {
    box-sizing: border-box;
    font-family: "Meiryo", "Hiragino Kaku Gothic ProN", "MS Gothic", sans-serif;
  }
  body {
    margin: 0;
    padding: 10px;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
  }

  /* A6現品票カード本体 */
  .slip-card {
    width: 105mm;
    height: 148mm;
    background: #fff;
    border: 2px solid #0000cd; /* 実物の青枠 */
    padding: 3mm 4mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  /* テーブル共通設定 */
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  th, td {
    border: 1px solid #000;
    padding: 1px 2px;
    text-align: center;
    vertical-align: middle;
    word-break: break-all;
  }

  /* タイトル装飾 */
  .main-title {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .rohs-title {
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    -webkit-text-stroke: 1px #000;
    text-stroke: 1px #000;
    letter-spacing: 2px;
    line-height: 1.1;
  }

  /* フォントサイズ・文字装飾 */
  .lbl-bold {
    font-size: 12px;
    font-weight: 900;
  }
  .lbl-small {
    font-size: 9px;
    font-weight: bold;
  }
  .sub-note {
    font-size: 8px;
    font-weight: normal;
  }

  /* バーコードSVGのサイズ調整 */
  .barcode-svg {
    display: block;
    margin: 0 auto;
    max-width: 100%;
  }

  /* 下部捺印ボックス */
  .stamp-box-title {
    font-size: 8px;
    font-weight: bold;
    display: block;
    border-bottom: 1px solid #000;
    padding-bottom: 1px;
    line-height: 1;
  }
  .stamp-thick-border {
    border: 1.8px solid #000 !important;
  }

  @media print {
    body {
      background: none;
      padding: 0;
    }
    .slip-card {
      border: 2px solid #0000cd;
      margin: 0;
      page-break-inside: avoid;
    }
  }
</style>
</head>
<body>

<div class="slip-card">
  <div>
    <!-- 表題部 -->
    <div style="text-align: center; margin-bottom: 2px;">
      <div class="main-title">基板製品ロット現品票</div>
      <div class="rohs-title">完全RoHS対応品</div>
    </div>

    <!-- 上段テーブル -->
    <table>
      <colgroup>
        <col style="width: 20%;">
        <col style="width: 23%;">
        <col style="width: 17%;">
        <col style="width: 20%;">
        <col style="width: 20%;">
      </colgroup>
      
      <!-- 製品名 -->
      <tr style="height: 24px;">
        <td class="lbl-bold">製品名</td>
        <td colspan="2"></td>
        <td colspan="2">
          <!-- 中身: *722* -->
          <svg id="barcode-product" class="barcode-svg"></svg>
        </td>
      </tr>

      <!-- Lot. No. -->
      <tr style="height: 24px;">
        <td class="lbl-bold">Lot.№</td>
        <td colspan="2"></td>
        <td colspan="2">
          <!-- 中身: ロット番号（ダミーでTESTを入力、空にしたい場合は空白可） -->
          <svg id="barcode-lot" class="barcode-svg"></svg>
        </td>
      </tr>

      <!-- 数量 -->
      <tr style="height: 20px;">
        <td class="lbl-bold">数量</td>
        <td colspan="4" style="text-align: left; position: relative;">
          <span class="sub-note" style="position: absolute; top: 1px; left: 3px;">分割数量</span>
          <div style="text-align: center; font-size: 14px; line-height: 1;">/</div>
          <span class="sub-note" style="position: absolute; bottom: 1px; right: 3px;">LOT総数</span>
        </td>
      </tr>

      <!-- LOT数 -->
      <tr style="height: 20px;">
        <td class="lbl-bold">LOT数</td>
        <td colspan="4" style="text-align: left; position: relative;">
          <span class="sub-note" style="position: absolute; top: 1px; left: 3px;">分割LOT数</span>
          <div style="text-align: center; font-size: 14px; line-height: 1;">/</div>
          <span class="sub-note" style="position: absolute; bottom: 1px; right: 3px;">LOT分割総数</span>
        </td>
      </tr>

      <!-- 分割履歴 ヘッダー -->
      <tr style="height: 16px;" class="lbl-small">
        <td rowspan="4" class="lbl-bold" style="font-size: 12px; line-height: 1.2;">
          分割総数
        </td>
        <td>日付</td>
        <td>数量</td>
        <td>日付</td>
        <td>数量</td>
      </tr>
      <!-- 分割明細（3行） -->
      <tr style="height: 18px;"><td></td><td></td><td></td><td></td></tr>
      <tr style="height: 18px;"><td></td><td></td><td></td><td></td></tr>
      <tr style="height: 18px;"><td></td><td></td><td></td><td></td></tr>
    </table>

    <!-- 二重線 -->
    <div style="height: 2px; border-top: 1px solid #000; border-bottom: 1px solid #000; margin: 2px 0;"></div>

    <!-- 後工程チェック欄 -->
    <table>
      <colgroup>
        <col style="width: 20%;">
        <col style="width: 20%;">
        <col style="width: 20%;">
        <col style="width: 20%;">
        <col style="width: 20%;">
      </colgroup>
      <tr style="height: 16px; font-size: 9px; font-weight: bold;">
        <td>部品後付</td>
        <td>目視検査①</td>
        <td>目視検査②</td>
        <td>基板カット</td>
        <td>基板電検</td>
      </tr>
      <tr style="height: 38px;">
        <td></td><td></td><td></td><td></td><td></td>
      </tr>
    </table>

    <!-- メモ ＆ 捺印枠 -->
    <table style="border-top: none; margin-top: 2px;">
      <colgroup>
        <col style="width: 16%;">
        <col style="width: 18%;">
        <col style="width: 15%;">
        <col style="width: 16%;">
        <col style="width: 17%;">
        <col style="width: 18%;">
      </colgroup>
      <tr>
        <td colspan="6" style="height: 12px; border: none; text-align: left; font-size: 9px; font-weight: bold; padding: 0;">
          メモ
        </td>
      </tr>
      <tr style="height: 44px; vertical-align: top;">
        <td><span class="stamp-box-title">スクラップ</span></td>
        <td><span class="stamp-box-title">チェッカーNG</span></td>
        <td><span class="stamp-box-title">ボンド</span></td>
        <td><span class="stamp-box-title">ボンド確認</span></td>
        <td><span class="stamp-box-title">枚数確認</span></td>
        <td class="stamp-thick-border"><span class="stamp-box-title" style="font-size: 9px;">受取確認</span></td>
      </tr>
    </table>
  </div>

  <!-- 最下部：管理番号 ＆ SUF-0722 バーコード -->
  <table style="border: none; margin-top: 1px;">
    <tr style="border: none;">
      <td style="border: none; width: 23%; text-align: left; font-size: 8px; padding: 0;">
        【用紙色：白色】
      </td>
      <td style="border: none; width: 14%; text-align: right; font-size: 10px; padding: 0;">
        File №
      </td>
      <td style="border: none; width: 17%; text-align: left; font-size: 18px; font-weight: 900; padding: 0 0 0 3px;">
        722
      </td>
      <td style="border: none; width: 46%; text-align: right; padding: 0;">
        <!-- 中身: *SUF-0722* -->
        <svg id="barcode-file" class="barcode-svg" style="float: right;"></svg>
      </td>
    </tr>
  </table>

</div>

<!-- 実バーコード生成スクリプト（Code 39） -->
<script>
  // 1. 製品名バーコード: 722
  JsBarcode("#barcode-product", "722", {
    format: "CODE39",
    width: 1.1,
    height: 18,
    displayValue: false, // バーコード下の数字非表示
    margin: 0
  });

  // 2. Lot.No.バーコード (ひな形用ダミー)
  JsBarcode("#barcode-lot", "LOT", {
    format: "CODE39",
    width: 1.0,
    height: 18,
    displayValue: false,
    margin: 0
  });

  // 3. 最下部バーコード: SUF-0722
  JsBarcode("#barcode-file", "SUF-0722", {
    format: "CODE39",
    width: 0.9,
    height: 22,
    displayValue: true, // "* SUF-0722 *" テキストを表示
    fontSize: 9,
    textMargin: 1,
    margin: 0
  });
</script>

</body>
</html>
