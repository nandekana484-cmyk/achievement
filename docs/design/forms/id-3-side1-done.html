<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1回目完了済み (A6横)</title>
<!-- 実バーコード描画ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
  /* A6横サイズ印刷設定 (148mm × 105mm) */
  @page {
    size: 148mm 105mm landscape;
    margin: 0;
  }
  * {
    box-sizing: border-box;
    font-family: "Meiryo", "Hiragino Kaku Gothic ProN", "Arial", sans-serif;
  }
  body {
    margin: 0;
    padding: 10px;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
  }

  /* A6横カード本体（実物通りの青色外枠） */
  .card-landscape {
    width: 148mm;
    height: 105mm;
    background: #fff;
    border: 2.5px solid #0000cd;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* テーブル共通設定 */
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  td {
    border: 1.5px solid #000;
    padding: 3px 6px;
    vertical-align: top;
    word-break: break-all;
  }

  /* 上段：File No. & 製品名エリア */
  .row-top {
    height: 38mm;
  }
  .cell-fileno {
    width: 22%;
    border-top: none;
    border-left: none;
  }
  .cell-product {
    width: 78%;
    border-top: none;
    border-right: none;
  }

  /* 中段：ロットNoエリア */
  .row-lot {
    height: 25mm;
  }
  .cell-lot {
    border-left: none;
    border-right: none;
  }

  /* 見出し文字スタイル */
  .label-title {
    font-size: 15px;
    font-weight: bold;
    display: block;
  }

  /* 入力枠の値（初期値 0 などの大きな中央配置文字） */
  .value-center {
    font-size: 26px;
    font-weight: bold;
    text-align: center;
    margin-top: 2px;
  }

  /* 下段：完了・バーコードエリア */
  .bottom-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-top: 2px;
  }
  .title-complete-ja {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.1;
    margin-bottom: 2px;
  }
  .title-complete-sub {
    font-size: 13px;
    font-weight: bold;
    text-align: center;
    line-height: 1.25;
    margin-bottom: 2px;
  }

  /* バーコードSVG */
  .barcode-svg {
    display: block;
  }

  /* 最下部右端のFormat日付 */
  .format-date {
    position: absolute;
    bottom: 2px;
    right: 5px;
    font-size: 8.5px;
    color: #000;
  }

  @media print {
    body {
      background: none;
      padding: 0;
    }
    .card-landscape {
      border: 2.5px solid #0000cd;
      margin: 0;
      page-break-inside: avoid;
    }
  }
</style>
</head>
<body>

<div class="card-landscape">

  <!-- 上段：File No. ＆ 製品名 -->
  <table>
    <tr class="row-top">
      <td class="cell-fileno">
        <span class="label-title">File №</span>
        <div class="value-center">0</div>
      </td>
      <td class="cell-product">
        <span class="label-title">Tên sản phẩm (製品名) PRODUTO</span>
        <div class="value-center">0</div>
      </td>
    </tr>
  </table>

  <!-- 中段：ロットNo. -->
  <table>
    <tr class="row-lot">
      <td class="cell-lot">
        <span class="label-title">Số lô, (ロットNo,) LOTE</span>
        <div class="value-center">0</div>
      </td>
    </tr>
  </table>

  <!-- 下段：1回目完了済み ＆ バーコード -->
  <div class="bottom-area">
    <div class="title-complete-ja">1回目完了済み</div>
    <div class="title-complete-sub">
      Lần đầu tiên hoàn thành<br>
      (PLACAS PRONTAS O LADO 1)
    </div>
    
    <!-- 下部バーコード（*SUF-0501*） -->
    <svg id="barcode-bottom" class="barcode-svg"></svg>
    
    <!-- 右下フォーマット日付 -->
    <div class="format-date">Format 2018/1/18</div>
  </div>

</div>

<!-- Code 39 実バーコード描画スクリプト -->
<script>
  JsBarcode("#barcode-bottom", "SUF-0501", {
    format: "CODE39",
    width: 1.3,
    height: 30,
    displayValue: true,    // "* SUF-0501 *" 表示
    font: "monospace",
    fontSize: 9.5,
    textMargin: 1,
    margin: 0
  });
</script>

</body>
</html>
